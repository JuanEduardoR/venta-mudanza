<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">

    <!-- Tailwind CSS -->

    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',

                        }
                    }
                }
            }
        }

    <style>

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

                        <span class="hidden sm:inline">Catálogo</span>
                    </button>

                        <span class="hidden sm:inline">Administrar</span>

                    </button>
                </div>
            </div>

    </header>
